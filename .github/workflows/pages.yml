name: Deploy Rhys Airways site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site artifact
        run: |
          mkdir -p "$RUNNER_TEMP/_site"
          cp -r . "$RUNNER_TEMP/_site/"
          rm -rf "$RUNNER_TEMP/_site/.git" "$RUNNER_TEMP/_site/.github" "$RUNNER_TEMP/_site/README.md" || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
